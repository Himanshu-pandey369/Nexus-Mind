<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NexusMind icon</title>
  <desc id="desc">An abstract interwoven N with luminous violet, silver and champagne accents on a transparent background.</desc>
  <defs>
    <linearGradient id="ribbonA" x1="105" y1="90" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3dc"/>
      <stop offset=".22" stop-color="#c8c2d8"/>
      <stop offset=".52" stop-color="#7b65d8"/>
      <stop offset=".78" stop-color="#eee0d1"/>
      <stop offset="1" stop-color="#8e78ed"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="95" y1="390" x2="425" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cff"/>
      <stop offset=".35" stop-color="#c6b8ff"/>
      <stop offset=".7" stop-color="#fff0d7"/>
      <stop offset="1" stop-color="#9d7cff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="80" y1="110" x2="440" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4d8a6"/>
      <stop offset=".48" stop-color="#fff0d6" stop-opacity=".25"/>
      <stop offset=".75" stop-color="#9274ff"/>
      <stop offset="1" stop-color="#f1d5a0"/>
    </linearGradient>
    <linearGradient id="edge" x1="120" y1="100" x2="380" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8eb" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#c5b6ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff0d7" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <!-- Fine orbital sweep -->
  <path d="M91 190C125 91 239 47 339 83c72 26 113 86 103 151" fill="none" stroke="url(#orbit)" stroke-width="3.2" stroke-linecap="round" opacity=".8"/>
  <path d="M117 402c57 59 153 76 233 35 39-20 67-51 82-88" fill="none" stroke="url(#orbit)" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <!-- Interwoven N ribbon: broad continuous silhouette -->
  <path d="M145 378V169c0-25 29-37 47-19l158 174V150c0-15 12-27 27-27h18v220c0 25-29 37-47 19L190 188v190z"
        fill="none" stroke="#171321" stroke-width="48" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>
  <path d="M145 378V169c0-25 29-37 47-19l158 174V150c0-15 12-27 27-27h18v220c0 25-29 37-47 19L190 188v190z"
        fill="none" stroke="url(#ribbonA)" stroke-width="35" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M112 347c44-38 88-72 131-105 49-37 102-73 157-103 23-13 49-5 58 16 8 19-1 39-20 50-64 36-122 75-176 116-40 30-78 62-113 95-18 17-44 14-56-4-12-18-5-46 19-65z"
        fill="none" stroke="url(#ribbonB)" stroke-width="17" stroke-linecap="round" opacity=".96"/>
  <path d="M117 345c56-48 112-91 172-132 39-27 77-51 116-72" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
  <!-- Champagne sparkle -->
  <path d="M390 67c4 27 11 34 38 38-27 4-34 11-38 38-4-27-11-34-38-38 27-4 34-11 38-38z" fill="#f4d7a5"/>
  <circle cx="390" cy="105" r="4" fill="#fff8e9"/>
</svg>
