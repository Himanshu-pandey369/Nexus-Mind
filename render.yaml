services:
  # ==============================================================================
  # SERVICE 1: API GATEWAY (Public Web Service)
  # Acts as the single entrypoint for all frontend traffic. Verifies Firebase
  # sessions via Redis, enforces rate limits, and proxies to private services.
  # ==============================================================================
  - type: web
    name: nexusmind-gateway
    runtime: docker
    dockerContext: Backend
    dockerfilePath: Backend/Gateway/Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: TRUST_PROXY
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SERVICE
        fromService:
          type: pserv
          name: nexusmind-auth
          property: hostport
      - key: CHAT_SERVICE
        fromService:
          type: pserv
          name: nexusmind-chat
          property: hostport
      - key: PAYMENT_SERVICE
        fromService:
          type: pserv
          name: nexusmind-payment
          property: hostport
      - key: AGENT_SERVICE
        fromService:
          type: pserv
          name: nexusmind-agent
          property: hostport
      - key: INTERNAL_SECRET
        fromService:
          type: pserv
          name: nexusmind-auth
          envVarKey: INTERNAL_SECRET

  # ==============================================================================
  # SERVICE 2: AUTH & CREDITS SERVICE (Private Service)
  # Manages user profiles, Firebase authentication validation, user credits balance,
  # and credit reservations/commitments. Accessible only within private network.
  # ==============================================================================
  - type: pserv
    name: nexusmind-auth
    runtime: docker
    dockerContext: Backend
    dockerfilePath: Backend/Services/auth/Dockerfile
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8001"
      - key: INTERNAL_HOST
        value: "0.0.0.0"
      - key: AUTH_MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INTERNAL_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # ==============================================================================
  # SERVICE 3: CHAT SERVICE (Private Service)
  # Manages conversations, message persistence, and history retrieval.
  # Accessible only within private network.
  # ==============================================================================
  - type: pserv
    name: nexusmind-chat
    runtime: docker
    dockerContext: Backend
    dockerfilePath: Backend/Services/Chat/Dockerfile
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8002"
      - key: INTERNAL_HOST
        value: "0.0.0.0"
      - key: CHAT_MONGODB_URI
        sync: false

  # ==============================================================================
  # SERVICE 4: PAYMENT SERVICE (Private Service)
  # Handles Razorpay orders, payment verification, and credit fulfillment.
  # Calls Auth Service to add credits upon verified payment.
  # Accessible only within private network (webhook proxied through Gateway).
  # ==============================================================================
  - type: pserv
    name: nexusmind-payment
    runtime: docker
    dockerContext: Backend
    dockerfilePath: Backend/Services/Payment/Dockerfile
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8003"
      - key: INTERNAL_HOST
        value: "0.0.0.0"
      - key: PAYMENT_MONGODB_URI
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          type: pserv
          name: nexusmind-auth
          property: hostport
      - key: INTERNAL_SECRET
        fromService:
          type: pserv
          name: nexusmind-auth
          envVarKey: INTERNAL_SECRET
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ==============================================================================
  # SERVICE 5: AI AGENT SERVICE (Private Service)
  # Manages LangChain/LangGraph agents, RAG, tool calling, and Cloudinary uploads.
  # Runs in its own container so heavy AI memory usage is isolated from other services.
  # ==============================================================================
  - type: pserv
    name: nexusmind-agent
    runtime: docker
    dockerContext: Backend
    dockerfilePath: Backend/Services/Agent/Dockerfile
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8083"
      - key: INTERNAL_HOST
        value: "0.0.0.0"
      - key: AGENT_MONGODB_URI
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          type: pserv
          name: nexusmind-auth
          property: hostport
      - key: CHAT_SERVICE_URL
        fromService:
          type: pserv
          name: nexusmind-chat
          property: hostport
      - key: INTERNAL_SECRET
        fromService:
          type: pserv
          name: nexusmind-auth
          envVarKey: INTERNAL_SECRET
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: "nexusmind_pdf_rag"
