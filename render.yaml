services:
  - type: web
    name: nexusmind-gateway
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    region: oregon
    branch: main
    dockerContext: Backend
    dockerfilePath: Backend/Gateway/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_SECRET
        fromService:
          type: web
          name: nexusmind-auth
          envVarKey: INTERNAL_SECRET
      - key: AUTH_SERVICE
        fromService:
          type: web
          name: nexusmind-auth
          envVarKey: RENDER_EXTERNAL_URL
      - key: CHAT_SERVICE
        fromService:
          type: web
          name: nexusmind-chat
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAYMENT_SERVICE
        fromService:
          type: web
          name: nexusmind-payment
          envVarKey: RENDER_EXTERNAL_URL
      - key: AGENT_SERVICE
        fromService:
          type: web
          name: nexusmind-agent
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: nexusmind-auth
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    region: oregon
    branch: main
    dockerContext: Backend
    dockerfilePath: Backend/Services/auth/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INTERNAL_SECRET
        generateValue: true

  - type: web
    name: nexusmind-chat
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    region: oregon
    branch: main
    dockerContext: Backend
    dockerfilePath: Backend/Services/Chat/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHAT_MONGODB_URI
        sync: false
      - key: INTERNAL_SECRET
        fromService:
          type: web
          name: nexusmind-auth
          envVarKey: INTERNAL_SECRET

  - type: web
    name: nexusmind-payment
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    region: oregon
    branch: main
    dockerContext: Backend
    dockerfilePath: Backend/Services/Payment/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MONGODB_URI
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: nexusmind-auth
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTERNAL_SECRET
        fromService:
          type: web
          name: nexusmind-auth
          envVarKey: INTERNAL_SECRET
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: nexusmind-agent
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    region: oregon
    branch: main
    dockerContext: Backend
    dockerfilePath: Backend/Services/Agent/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGENT_MONGODB_URI
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: nexusmind-auth
          envVarKey: RENDER_EXTERNAL_URL
      - key: CHAT_SERVICE_URL
        fromService:
          type: web
          name: nexusmind-chat
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTERNAL_SECRET
        fromService:
          type: web
          name: nexusmind-auth
          envVarKey: INTERNAL_SECRET
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: nexusmind_pdf_rag
